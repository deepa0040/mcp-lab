[project]
name = "weather-mcp"
version = "0.1.0"
description = "MCP server wrapping the Open-Meteo API"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]<2",
    "httpx>=0.27",
]

# Quick start:
#   uv sync
#   uv run mcp dev server.py        # MCP Inspector in your browser
#
# Claude Desktop config (claude_desktop_config.json):
#   {
#     "mcpServers": {
#       "weather": {
#         "command": "uv",
#         "args": ["--directory", "/ABSOLUTE/PATH/TO/weather-mcp", "run", "server.py"]
#       }
#     }
#   }
#
# Claude Code:
#   claude mcp add weather -- uv --directory /ABSOLUTE/PATH/TO/weather-mcp run server.py